<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табло AI-департаменту</title>
<style>
:root{
  --bg:#0e0c1d;--panel:#16132b;--room:#1a1731;--room-cur:#211c42;--line:#2b2652;--line-strong:#3d3675;
  --text:#ece9ff;--muted:#9a94c4;--faint:#6d679a;
  --violet:#8b7cf6;--violet-soft:#2c2560;--green:#34d399;--green-soft:#123a30;--amber:#fbbf24;--amber-soft:#3d2f0e;--red:#f87171;--red-soft:#3f1a1f;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1480px;margin:0 auto;padding:16px 16px 40px}

/* Шапка */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:12px;background:var(--violet);display:grid;place-items:center;font-weight:700;color:#120f24}
.brand b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.brand select{background:transparent;border:0;font-size:15px;font-weight:600;padding:0;max-width:240px;cursor:pointer}
.brand select option{background:var(--panel)}
.now{min-width:0}
.now h1{font-size:19px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now p{color:var(--muted);margin-top:2px;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now p b{color:var(--text);font-weight:600}
.lvl{display:flex;align-items:center;gap:14px}
.lvl-badge{width:52px;height:52px;border-radius:50%;border:3px solid var(--violet);display:grid;place-items:center;font-size:20px;font-weight:700;position:relative}
.lvl-badge small{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--violet);color:#120f24;border-radius:6px;padding:0 5px;font-weight:700;letter-spacing:.04em}
.lvl-info{width:220px}
.lvl-name{font-weight:600}
.xp{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 3px}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),#b4a8ff);border-radius:6px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.xp-txt{font-size:12px;color:var(--muted)}
.pct{font-size:30px;font-weight:700;min-width:84px;text-align:right;font-variant-numeric:tabular-nums}

/* Стежка рівнів */
.track{display:flex;align-items:flex-start;margin:14px 0;padding:12px 6px 4px;overflow-x:auto}
.node{flex:1 1 0;min-width:84px;display:flex;flex-direction:column;align-items:center;position:relative;gap:6px;color:var(--faint);font-size:12px;text-align:center}
.node::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.node:first-child::before{display:none}
.node.done::before,.node.cur::before{background:var(--green)}
.node .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line);color:var(--muted);z-index:1;position:relative;font-size:13px}
.node.done{color:var(--muted)}
.node.done .dot{background:var(--green);color:#082b20}
.node.cur{color:var(--text);font-weight:600}
.node.cur .dot{background:var(--violet);color:#120f24}
.node.cur .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--violet);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.6);opacity:0}}
.lock{position:absolute;top:4px;left:-12px;z-index:2;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line-strong)}
.lock svg{width:13px;height:13px}
.lock.g-wait{border-color:var(--amber);animation:pulse 1s ease-in-out infinite}
.lock.g-open{border-color:var(--green)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(251,191,36,.25)}}

/* Демо */
.demo-bar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:8px 12px;border:1px dashed var(--line-strong);border-radius:10px;color:var(--muted);font-size:13px}
.demo-bar.on{display:flex}
.demo-bar .tag-demo{background:var(--amber);color:#3a2a05;font-weight:700;border-radius:6px;padding:1px 7px;font-size:12px}
/* Попередження: дані застарілі або сервер мовчить. Офіс тьмяніє й завмирає, щоб стара картина не видавалася за живу */
.notice{margin-top:12px;padding:8px 12px;border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;font-size:13px}
.notice[hidden]{display:none}
body.outdated .office,body.outdated .track{opacity:.5;filter:grayscale(.7)}
body.outdated .office *{animation-play-state:paused !important}
.btn{background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--violet)}
.btn.on{background:var(--violet-soft);border-color:var(--violet)}

/* Офіс + бокова панель */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.office{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.room{background:var(--room);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px;position:relative;transition:background .6s,border-color .6s,opacity .6s;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:22px 22px}
.room.span2{grid-column:span 2}
.room.cur{background-color:var(--room-cur);border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 10px 40px -12px rgba(139,124,246,.45)}
.room.future{opacity:.62}
.room-h{display:flex;gap:10px;align-items:center}
.room-h .n{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--muted);flex:none}
.room.done .room-h .n{background:var(--green);color:#082b20}
.room.cur .room-h .n{background:var(--violet);color:#120f24}
.room-h h3{font-size:14px;font-weight:650}
.room-h p{font-size:12px;color:var(--muted)}
.room-h .grow{flex:1;min-width:0}
.badge-now{font-size:10px;font-weight:800;letter-spacing:.08em;color:#120f24;background:var(--violet);border-radius:6px;padding:2px 6px;display:none}
.room.cur .badge-now{display:inline-block}
.gate-chip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:7px;padding:2px 6px;border:1px solid var(--line-strong);color:var(--muted)}
.gate-chip svg{width:12px;height:12px}
.gate-chip.g-wait{color:var(--amber);border-color:var(--amber);animation:pulse 1s infinite}
.gate-chip.g-open{color:var(--green);border-color:var(--green)}
.rbar{height:4px;border-radius:3px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--violet);transition:width 1s}
.room.done .rbar i{background:var(--green)}
.desks{display:flex;flex-wrap:wrap;justify-content:center;gap:50px 6px;padding-top:50px}

/* Стіл і бот */
.desk{width:100px;display:flex;flex-direction:column;align-items:center;position:relative}
.desk.hidden{display:none}
.bot{width:96px;height:90px;display:block;overflow:visible}
.bot .rig,.bot .arm,.bot .eyes,.bot .halo,.bot .bell{transform-box:fill-box;transform-origin:50% 100%}
.bot .eyes{transform-origin:50% 50%}
.bot .zzz,.bot .check,.bot .alert{opacity:0;transition:opacity .3s}
.bot .ant{transition:fill .3s}
.s-work .rig{animation:bob .9s ease-in-out infinite}
.s-work .arm-l{animation:type .22s ease-in-out infinite alternate}
.s-work .arm-r{animation:type .22s ease-in-out .11s infinite alternate}
.s-work .ant{fill:var(--amber);animation:blinkant 1s steps(2) infinite}
.s-work .logo{fill:var(--violet);animation:glow 1.4s ease-in-out infinite}
.eyes{animation:blink 4s infinite}
.s-sleep{opacity:.5}
.s-sleep .eyes{transform:scaleY(.14);animation:none}
.s-sleep .rig{animation:breathe 3.2s ease-in-out infinite}
.s-sleep .zzz{opacity:1}
.s-sleep .zzz text{animation:zz 2.6s ease-in infinite}
.s-sleep .zzz text:nth-child(2){animation-delay:1.3s}
.s-queue .eyes{animation:look 5s ease-in-out infinite}
.s-done .check{opacity:1}
.s-done .check{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.s-done .eyes{transform:scaleY(.55);animation:none}
.s-wait .rig{animation:wiggle .7s ease-in-out infinite}
.s-wait .ant{fill:var(--amber)}
.s-blocked .rig{animation:shake .45s ease-in-out infinite}
.s-blocked .alert{opacity:1}
.s-blocked .ant{fill:var(--red)}
.human .halo{opacity:0}
.human.s-wait .halo{opacity:1;animation:halo 1.2s ease-out infinite}
.human.s-wait .bell{opacity:1;animation:ringbell .5s ease-in-out infinite;transform-origin:50% 0}
.human .bell{opacity:0}
.human.s-wait .rig{animation:none}
.human.s-done .check{opacity:1}
.human.s-idle .rig{animation:breathe 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes type{to{transform:translateY(-3px)}}
@keyframes blinkant{50%{opacity:.25}}
@keyframes glow{50%{opacity:.35}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes breathe{50%{transform:translateY(1.5px)}}
@keyframes zz{0%{transform:translate(0,4px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
@keyframes look{0%,35%{transform:translateX(0)}45%,62%{transform:translateX(-3px)}72%,90%{transform:translateX(3px)}100%{transform:translateX(0)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes halo{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes ringbell{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.tag{text-align:center;margin-top:2px;line-height:1.2}
.tag b{display:block;font-size:12px;font-weight:650}
.tag span{display:block;font-size:10.5px;color:var(--faint)}
.tag em{display:inline-block;font-style:normal;font-size:10px;font-weight:700;color:var(--violet);background:var(--violet-soft);border-radius:5px;padding:0 5px;margin-top:2px}
.tag em:empty{display:none}
.bubble{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translate(-50%,6px) scale(.9);width:max-content;max-width:100px;background:#f4f2ff;color:#1b1638;font-size:10.5px;line-height:1.25;border-radius:9px;padding:4px 7px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5;text-align:left}
.bubble .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desk:hover .bubble .txt{-webkit-line-clamp:unset}
.desk:hover .bubble{z-index:6;max-width:180px}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#f4f2ff}
.desk.st-work .bubble,.desk.st-wait .bubble,.desk.st-blocked .bubble{opacity:1;transform:translate(-50%,0) scale(1)}
.desk.st-wait .bubble{background:var(--amber);color:#3a2a05}
.desk.st-wait .bubble::after{border-top-color:var(--amber)}
.desk.st-blocked .bubble{background:var(--red);color:#3a0d12}
.desk.st-blocked .bubble::after{border-top-color:var(--red)}
.dots{display:inline-flex;gap:2px;margin-top:2px;vertical-align:middle}
.dots i{width:3px;height:3px;border-radius:50%;background:currentColor;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.desk:not(.st-work) .dots{display:none}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* Кабінет людини */
.cabinet{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}
.cabinet .room-h{grid-column:1/-1}
.cabinet .desks{padding-top:6px}
.cab-msg h3{font-size:17px;font-weight:700}
.cab-msg p{color:var(--muted);margin-top:4px}
.cab-msg .q{margin-top:8px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;padding:8px 10px;color:var(--text)}
.cabinet.waiting{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 10px 40px -12px rgba(251,191,36,.45)}
.gates{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* Бокова панель */
aside{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h2{font-size:14px;font-weight:650;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card h2 span{color:var(--muted);font-weight:500;font-size:12px}
.ach-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ach{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--room);border:1px solid var(--line);filter:grayscale(1);opacity:.35;position:relative;cursor:default;transition:all .5s}
.ach.on{filter:none;opacity:1;border-color:var(--amber);background:var(--amber-soft)}
.ach.fresh{animation:achpop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes achpop{0%{transform:scale(.4) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.ach-hint{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}
.waves{display:flex;flex-direction:column;gap:8px}
.wave{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wave>span{font-size:11px;color:var(--faint);width:52px}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--line);color:var(--muted)}
.chip.in_progress{background:var(--violet-soft);color:#c9c1ff;animation:glow 1.4s infinite}
.chip.done{background:var(--green-soft);color:var(--green)}
.chip.blocked{background:var(--red-soft);color:var(--red)}
.chip.cancelled,.chip.split{opacity:.5;text-decoration:line-through}
.tasks-sum{font-size:12px;color:var(--muted);margin-top:8px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.feed li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:baseline;font-size:12.5px}
.feed li i{width:8px;height:8px;border-radius:50%;display:block;margin-top:4px}
.feed li small{color:var(--faint);font-size:11px;white-space:nowrap}
.feed li.fresh{animation:fadein .6s}
@keyframes fadein{from{opacity:0;transform:translateX(8px)}}
.muted{color:var(--muted)}

/* Порожній стан, тости, конфеті */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty h2{font-size:20px;margin-bottom:8px}
.empty code{background:var(--room);padding:2px 6px;border-radius:6px}
.empty .btn{margin-top:16px;padding:8px 16px}
#toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--amber);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;min-width:240px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:toastin .5s cubic-bezier(.2,1.4,.4,1)}
.toast .ic{font-size:24px}
.toast b{display:block}
.toast span{font-size:12px;color:var(--muted)}
.toast.lvlup{border-color:var(--violet)}
.toast.out{animation:toastout .4s forwards}
@keyframes toastin{from{transform:translateX(120%)}}
@keyframes toastout{to{transform:translateX(120%);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (max-width:1180px){.layout{grid-template-columns:1fr}.office{grid-template-columns:repeat(2,minmax(0,1fr))}.room.span2{grid-column:span 2}}
@media (max-width:820px){.top{grid-template-columns:1fr}.lvl{justify-content:space-between}.lvl-info{flex:1;width:auto}}
@media (max-width:640px){.office{grid-template-columns:1fr}.room.span2{grid-column:span 1}.cabinet{grid-template-columns:1fr}.ach-grid{grid-template-columns:repeat(5,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">AI</div>
      <div><b>AI-департамент</b><select id="proj" aria-label="Проєкт"></select></div>
    </div>
    <div class="now"><h1 id="title">Табло департаменту</h1><p id="activity"></p></div>
    <div class="lvl">
      <div class="lvl-badge"><span id="lvlNum">1</span><small>РІВ</small></div>
      <div class="lvl-info"><div class="lvl-name" id="lvlName">—</div><div class="xp"><i id="xpFill"></i></div><div class="xp-txt" id="xpTxt">0 / 1000 XP</div></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </header>
  <div class="demo-bar" id="demoBar">
    <span class="tag-demo">ДЕМО</span><span>Вигаданий проєкт проходить усі 8 етапів.</span>
    <button class="btn" id="demoPlay">Пауза</button>
    <button class="btn" data-speed="1">1×</button><button class="btn" data-speed="2">2×</button><button class="btn" data-speed="4">4×</button>
    <button class="btn" id="demoRestart">Заново</button>
    <button class="btn" id="demoExit" hidden>До справжніх проєктів</button>
  </div>
  <div class="notice" id="notice" role="status" hidden></div>
  <nav class="track" id="track" aria-label="Рівні"></nav>
  <div class="layout">
    <main class="office" id="office"></main>
    <aside>
      <section class="card"><h2>Досягнення <span id="achCount"></span></h2><div class="ach-grid" id="ach"></div><div class="ach-hint" id="achHint">Наведи на значок, щоб побачити умову</div></section>
      <section class="card"><h2>Таски <span id="tasksCount"></span></h2><div id="tasks"></div></section>
      <section class="card"><h2>Журнал</h2><ol class="feed" id="feed"></ol></section>
    </aside>
  </div>
</div>
<div id="toasts"></div>
<canvas id="confetti"></canvas>
<script>
"use strict";

// ---------- Модель департаменту ----------
const STAGES = [
  {id:"1-start", name:"Старт", desc:"Ідея йде на інтерв'ю", w:10, agents:["brief-interviewer"], gate:"G1-brief", desks:["brief-interviewer"]},
  {id:"2-research", name:"Дослідження", desc:"Бізнес-сенс ідеї", w:5, agents:["business-analyst"], desks:["business-analyst"]},
  {id:"3-requirements", name:"Вимоги", desc:"Що саме будуємо", w:20, agents:["system-analyst","ambiguity-hunter","architect","ux-designer","security","critic","blind-acceptor"], gate:"G2-spec", span:2,
    desks:["system-analyst","ambiguity-hunter","architect","ux-designer","security","critic","blind-acceptor"]},
  {id:"4-plan", name:"План", desc:"Тест-план і таски", w:5, agents:["qa-engineer","planner"], desks:["qa-engineer","planner"]},
  {id:"5-dev", name:"Розробка", desc:"Спершу тест, потім код", w:35, agents:["test-author","developer","code-reviewer"], span:2,
    desks:["test-author#0","test-author#1","test-author#2","test-author#3","test-author#4","test-author#5",
           "developer#0","developer#1","developer#2","developer#3","developer#4","developer#5","code-reviewer"]},
  {id:"6-verify", name:"Перевірка", desc:"Перевіряє не автор", w:15, agents:["qa-engineer","security","blind-acceptor"], desks:["qa-engineer","security","blind-acceptor"]},
  {id:"7-release", name:"Реліз", desc:"На сервер — лише з «так»", w:5, agents:["devops","security"], gate:"G3-release", desks:["devops","security"]},
  {id:"8-operate", name:"Експлуатація", desc:"Пам'ять для наступного разу", w:5, agents:["memory-keeper"], desks:["memory-keeper"]},
];
const STAGE_IDX = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));
const GATES = [["G1-brief","G1","бриф",0],["G2-spec","G2","специфікація",2],["G3-release","G3","реліз",6]];

const ROLES = {

// Ворота пройдено лише за рішень, які справді їх відкривають. «Зупинено», «внести правки»
// чи будь-що інше в decision — не дозвіл
function gateOk(g){ return !!g && /^\s*(затверджено|лише локально|так(?=[\s,.!]|$))/i.test(String(g.decision || "")); }
function hasEvent(p, agent, event){ return p.history.some(h => h.agent === agent && h.event === event); }
function stageIndex(p){ return p.stage === "done" ? 8 : (STAGE_IDX[p.stage] ?? 0); }

// Події поточного проходу етапу: після повернення на етап старі «готово» вже не рахуються
function stageEvents(p, stId){
  let from = 0;
  p.history.forEach((h, i) => { if (h.event === "stage" && h.stage === stId) from = i; });
  return p.history.slice(from).filter(h => h.stage === stId);
}

function stageFraction(p, i){
  const st = STAGES[i];
  if (st.id === "5-dev" && p.tasks && p.tasks.total) return p.tasks.done / p.tasks.total;
  const done = new Set(stageEvents(p, st.id).filter(h => h.event === "done").map(h => h.agent));
  let f = st.agents.filter(a => done.has(a)).length / st.agents.length;
  if (st.gate && !gateOk(p.gates[st.gate])) f = Math.min(f, 0.9);
  return Math.min(f, 0.97);
}

function progress(p){
  const idx = stageIndex(p);
  if (idx >= 8) return 100;
  let sum = 0;
  for (let i = 0; i < idx; i++) sum += STAGES[i].w;
  return sum + STAGES[idx].w * stageFraction(p, idx);
}

// Ролі з кількома столами: скільки столів показувати навіть без роботи
const MULTI = {"test-author":2, "developer":2};
// Ролі, що повертаються на кожну хвилю: до кінця етапу вони «на зміні», а не «готово»
const RECURRING = new Set(["test-author", "developer", "code-reviewer"]);

// Кімната, де показати роль зараз. Агента можуть покликати поза його етапом (планувальника —
// посеред розробки): тоді він сидить у найближчій попередній кімнаті, де є його стіл
function homeRoom(role, idx){
  const has = r => STAGES[r].desks.some(k => k.split("#")[0] === role);
  const cur = Math.min(idx, STAGES.length - 1);
  if (has(cur)) return cur;
  for (let r = cur - 1; r >= 0; r--) if (has(r)) return r;
  for (let r = cur + 1; r < STAGES.length; r++) if (has(r)) return r;
  return -1;
}

// Таски, на яких роль застрягла: остання подія таска в цьому проході етапу — її «blocked»
function blockedTasks(p, stId, role){
  const lastByTask = {};
  stageEvents(p, stId).forEach(h => { if (h.task) lastByTask[h.task] = h; });
  return Object.values(lastByTask).filter(h => h.event === "blocked" && h.agent === role);
}

// Стан кожного столу в кімнаті r
function deskStates(p, r){
  const idx = stageIndex(p), st = STAGES[r], out = {};
  const waitAssigned = {};
  st.desks.forEach(key => {
    const [role, n] = key.split("#");
    const multi = role in MULTI;
    const here = idx < 8 && homeRoom(role, idx) === r;
    const roleActive = here ? p.active.filter(a => a.agent === role) : [];
    const stuck = multi && r === idx ? blockedTasks(p, st.id, role).filter(b => !roleActive.some(a => a.task === b.task)) : [];
    const info = {state:"sleep", bubble:"", task:"", hidden:false};
    if (multi) info.hidden = Number(n) >= Math.max(MULTI[role], roleActive.length + stuck.length);
    const act = multi ? roleActive[Number(n)] : roleActive[0];
    const waitsHere = here && p.waiting && p.waiting.agent === role && !act && !waitAssigned[role];
    if (act) Object.assign(info, {state:"work", bubble:act.doing || "працює", task:act.task || act.mode || ""});
    else if (waitsHere) {
      Object.assign(info, {state:"wait", bubble:"Питання до тебе", task:(String(p.waiting.question ?? "").match(/^T-\d+/) || [""])[0], hidden:false});
      waitAssigned[role] = true;
    }
    else if (idx >= 8 || r < idx) info.state = "done";
    else if (r > idx) info.state = "sleep";
    else {
      const last = [...stageEvents(p, st.id)].reverse().find(h => h.agent === role);
      const block = multi ? stuck[Number(n) - roleActive.length] : null;
      if (block) Object.assign(info, {state:"blocked", bubble:block.note || "заблоковано", task:block.task});
      else if (!multi && last && last.event === "blocked") Object.assign(info, {state:"blocked", bubble:last.note || "заблоковано"});
      else if (!RECURRING.has(role) && last && last.event === "done") info.state = "done";
      else info.state = "queue";
    }
    out[key] = info;
  });
  return out;
}

// ---------- Малюнки ----------
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k)));
  return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(c => c.toString(16).padStart(2, "0")).join("");
}

function buildOffice(){
  const office = $("office");
  office.innerHTML = "";
  STAGES.forEach((st, r) => {
    const room = document.createElement("section");
    room.className = "room future" + (st.span ? " span2" : "");
    const gate = GATES.find(g => g[3] === r);
    room.innerHTML = `<div class="room-h"><span class="n">${r + 1}</span><div class="grow"><h3>${st.name}</h3><p>${st.desc}</p></div>
      ${gate ? `<span class="gate-chip" data-gate="${gate[0]}">${LOCK_SVG(false)}${gate[1]}</span>` : ""}<span class="badge-now">ЗАРАЗ</span></div>
      <div class="rbar"><i></i></div><div class="desks"></div>`;
    const deskWrap = room.querySelector(".desks");
    st.desks.forEach(key => {
      const role = key.split("#")[0], R = ROLES[role];
      const d = document.createElement("div");
      d.className = "desk";
      d.innerHTML = `<div class="bubble"><span class="txt"></span><span class="dots"><i></i><i></i><i></i></span></div>${botSVG(role)}<div class="tag"><b>${R.name}</b><span>${R.title}</span><em></em></div>`;
      deskWrap.appendChild(d);
      els.desks[r + ":" + key] = {root:d, bot:d.querySelector(".bot"), txt:d.querySelector(".txt"), em:d.querySelector("em")};
    });
    office.appendChild(room);
    els.rooms.push({root:room, bar:room.querySelector(".rbar i"), gate:room.querySelector(".gate-chip")});
  });
  const cab = document.createElement("section");
  cab.className = "room cabinet span2";
  cab.innerHTML = `<div class="room-h"><span class="n">★</span><div class="grow"><h3>Твій кабінет</h3><p>Рішення на воротах — за тобою</p></div></div>
    <div class="desks"><div class="desk" id="humanDesk"><div class="bubble"><span class="txt">Твій хід!</span></div>${humanSVG()}<div class="tag"><b>Ти</b><span>Замовник</span><em></em></div></div></div>
    <div class="cab-msg" id="cabMsg"></div>`;
  office.appendChild(cab);
  els.cab = cab;
  els.human = {root:cab.querySelector("#humanDesk"), bot:cab.querySelector(".human")};
}

function setClass(el, cls){ if (el.getAttribute("class") !== cls) el.setAttribute("class", cls); }
function setText(el, t){ if (el.textContent !== t) el.textContent = t; }

// ---------- Час ----------
function parseTs(s){ return s ? new Date(String(s).replace(" ", "T")) : null; }
function ago(s){
  const d = parseTs(s); if (!d || isNaN(d)) return "";
  const sec = Math.max(0, (Date.now() - d) / 1000);
  if (sec < 45) return "щойно";
  if (sec < 3600) return Math.round(sec / 60) + " хв тому";
  if (sec < 86400) return Math.round(sec / 3600) + " год тому";
  return Math.round(sec / 86400) + " дн тому";
}
const pad = n => String(n).padStart(2, "0");
// Скільки вже триває робота агента: так завислого видно, а не лише того, хто працює
function lasting(s){
  const d = parseTs(s); if (!d || isNaN(d)) return "";
  const min = Math.max(0, Math.round((Date.now() - d) / 60000));
  if (min < 1) return "щойно почав";
  return min < 60 ? `уже ${min} хв` : `уже ${Math.floor(min / 60)} год ${pad(min % 60)} хв`;
}
function nowTs(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- Рендер ----------
let projects = [], selected = null;
const memory = {};

function current(){ return projects.find(p => p.slug === selected) || projects[0] || null; }

// Попередження над офісом: offline — сервер мовчить, stale — файл проєкту не читається,
// render — стан не вдалося показати. Поки є перші два, офіс тьмяніє.
const notices = {};
function setNotice(key, text){
  if (text) notices[key] = text; else delete notices[key];
  const all = Object.values(notices);
  $("notice").hidden = !all.length;
  setText($("notice"), all.join(" "));
  document.body.classList.toggle("outdated", "offline" in notices || "stale" in notices);
}

function render(){
  const p = current();
  const office = $("office");
  if (!p){ renderEmpty(); return; }
  if (!els.rooms.length || !office.contains(els.cab)) buildOffice();
  p.history = p.history || []; p.active = p.active || []; p.gates = p.gates || {};
  setNotice("stale", !p.stale ? "" : p.stale.since
    ? `Файл ${p.stale.file} зараз не читається. На екрані — остання вдала версія, від ${String(p.stale.since).slice(11, 16)}.`
    : `Файл ${p.stale.file} не читається, тому справжній стан проєкту невідомий.`);

  const idx = stageIndex(p), pct = progress(p), xp = Math.round(pct * 10);
  const lvl = Math.min(idx + 1, 8);
  setText($("title"), p.title || p.slug);
  setText($("lvlNum"), String(lvl));
  setText($("lvlName"), idx >= 8 ? "Майстер · цикл завершено" : `Рівень ${lvl} · ${STAGES[idx].name}`);
  $("xpFill").style.width = pct + "%";
  setText($("xpTxt"), `${xp} / 1000 XP`);
  setText($("pct"), Math.round(pct) + "%");
  $("activity").innerHTML = activityLine(p);
  renderTrack(p, idx);

  STAGES.forEach((st, r) => {
    const R = els.rooms[r];
    setClass(R.root, "room " + (r < idx ? "done" : r === idx ? "cur" : "future") + (st.span ? " span2" : ""));
    const f = r < idx ? 1 : r > idx ? 0 : stageFraction(p, r);
    R.bar.style.width = Math.round(f * 100) + "%";
    if (R.gate){
      const g = R.gate.dataset.gate, open = gateOk(p.gates[g]), wait = p.waiting && p.waiting.gate === g;
      setClass(R.gate, "gate-chip " + (open ? "g-open" : wait ? "g-wait" : ""));
      const svg = R.gate.querySelector("svg");
      if (svg.dataset.open !== String(open)){ svg.outerHTML = LOCK_SVG(open); R.gate.querySelector("svg").dataset.open = String(open); }
    }
    const states = deskStates(p, r);
    Object.entries(states).forEach(([key, info]) => {
      const D = els.desks[r + ":" + key];
      setClass(D.root, "desk st-" + info.state + (info.hidden ? " hidden" : ""));
      setClass(D.bot, "bot s-" + info.state);
      setText(D.txt, info.bubble);
      setText(D.em, info.task);
    });
  });
  renderCabinet(p, idx);
  renderAchievements(p);
  renderTasks(p);
  renderFeed(p);
  celebrate(p, lvl);
}

function activityLine(p){
  if (p.stage === "done") return "Цикл завершено. Ідея пройшла шлях до продакшену.";
  if (p.stopped) return `<b>Проєкт зупинено</b>${p.stopped.note ? ": " + esc(p.stopped.note) : ""}. Щоб продовжити — <code>/department ${esc(p.slug)}</code> у Claude Code.`;
  if (p.waiting) return `<b>Чекаємо на тебе:</b> ${esc(p.waiting.question)}`;
  if (!p.active.length) return "Департамент на мить зупинився між кроками.";
  const groups = {};
  p.active.forEach(a => { groups[a.agent] = (groups[a.agent] || 0) + 1; });
  const names = Object.entries(groups).map(([a, n]) => `<b>${esc((ROLES[a] || {name:a}).name)}${n > 1 ? " ×" + n : ""}</b>`);
  const first = p.active[0], t = lasting(first.since);
  return `Зараз працюють: ${names.join(", ")} · ${esc((ROLES[first.agent] || {name:first.agent}).name)} ${esc(first.doing || "")}${t ? " · " + t : ""}`;
}

function renderTrack(p, idx){
  const html = STAGES.map((st, i) => {
    const cls = i < idx ? "done" : i === idx ? "cur" : "";
    let lock = "";
    const g = GATES.find(g => g[3] + 1 === i);
    if (g){
      const open = gateOk(p.gates[g[0]]), wait = p.waiting && p.waiting.gate === g[0];
      lock = `<span class="lock ${open ? "g-open" : wait ? "g-wait" : ""}" title="Ворота ${g[1]} — ${g[2]}" style="color:${open ? "var(--green)" : wait ? "var(--amber)" : "var(--faint)"}">${LOCK_SVG(open)}</span>`;
    }
    return `<div class="node ${cls}">${lock}<span class="dot">${i < idx ? "✓" : i + 1}</span><span>${st.name}</span></div>`;
  }).join("");
  if ($("track").dataset.html !== html){ $("track").innerHTML = html; $("track").dataset.html = html; }
}

function renderCabinet(p, idx){
  const H = els.human, waiting = !!p.waiting, finished = idx >= 8;
  const state = waiting ? "wait" : finished ? "done" : "idle";
  setClass(H.root, "desk st-" + (waiting ? "wait" : "idle"));
  setClass(H.bot, "bot human s-" + state);
  setClass(els.cab, "room cabinet span2" + (waiting ? " waiting" : ""));
  let msg;
  if (waiting){
    const g = p.waiting.gate && GATES.find(x => x[0] === p.waiting.gate);
    const who = ROLES[p.waiting.agent] ? ROLES[p.waiting.agent].name : "Оркестратор";
    msg = `<h3>Твій хід!</h3><p>${g ? `Ворота ${g[1]} — ${g[2]}` : `Питання від: ${esc(who)}`} · ${ago(p.waiting.since)}</p>
      <div class="q">${esc(p.waiting.question)}</div><p style="margin-top:8px">Відповідай у чаті Claude Code.</p>`;
  } else if (finished){
    msg = `<h3>Готово 🎉</h3><p>Ідея пройшла всі 8 етапів. Нові ідеї й уроки — у PROJECT.md і lessons.md.</p>`;
  } else {
    const next = GATES.find(g => !gateOk(p.gates[g[0]]));
    msg = `<h3>Департамент працює</h3><p>${next ? `Наступні ворота: <b>${next[1]} — ${next[2]}</b> (етап ${next[3] + 1}). Тоді тебе покличуть.` : "Усі ворота пройдено."}</p>`;
  }
  const gates = GATES.map(g => {
    const open = gateOk(p.gates[g[0]]), wait = p.waiting && p.waiting.gate === g[0];
    return `<span class="gate-chip ${open ? "g-open" : wait ? "g-wait" : ""}">${LOCK_SVG(open)}${g[1]} · ${g[2]}</span>`;
  }).join("");
  const html = msg + `<div class="gates">${gates}</div>`;
  if ($("cabMsg").dataset.html !== html){ $("cabMsg").innerHTML = html; $("cabMsg").dataset.html = html; }
}

function renderAchievements(p){
  const mem = memory[p.slug] || {};
  const on = ACHIEVEMENTS.filter(a => a.test(p)).map(a => a.id);
  $("achCount").textContent = `${on.length} / ${ACHIEVEMENTS.length}`;
  const grid = $("ach");
  if (grid.children.length !== ACHIEVEMENTS.length){
    grid.innerHTML = ACHIEVEMENTS.map(a => `<div class="ach" data-id="${a.id}" tabindex="0" aria-label="${esc(a.name)}">${a.icon}</div>`).join("");
    [...grid.children].forEach(el => {
      const a = ACHIEVEMENTS.find(x => x.id === el.dataset.id);
      const show = () => { $("achHint").innerHTML = `<b>${esc(a.name)}</b> · ${esc(a.hint)}`; };
      el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
    });
  }
  [...grid.children].forEach(el => {
    const isOn = on.includes(el.dataset.id);
    const fresh = isOn && mem.achs && !mem.achs.includes(el.dataset.id);
    el.classList.toggle("on", isOn);
    if (fresh){ el.classList.remove("fresh"); void el.offsetWidth; el.classList.add("fresh"); }
  });
}

function renderTasks(p){
  const t = p.tasks;
  let html;
  if (!t || !t.total){ html = `<p class="muted">План ще не складено. Таски з'являться після етапу 4.</p>`; $("tasksCount").textContent = ""; }
  else {
    $("tasksCount").textContent = `${t.done} / ${t.total}`;
    html = `<div class="waves">` + t.waves.map((w, i) => `<div class="wave"><span>Хвиля ${i + 1}</span>${w.map(x => `<span class="chip ${esc(x.status)}" title="${esc(x.id + " · " + x.title)}">${esc(x.id)}</span>`).join("")}</div>`).join("") + `</div>
      <div class="tasks-sum">Готово ${t.done} · у роботі ${t.in_progress} · заблоковано ${t.blocked}</div>`;
  }
  if ($("tasks").dataset.html !== html){ $("tasks").innerHTML = html; $("tasks").dataset.html = html; }
}

const EVENT_TEXT = {
  stage: (h, n) => `Новий етап: ${(STAGES[STAGE_IDX[h.stage]] || {name:h.note}).name}${h.note && h.note !== (STAGES[STAGE_IDX[h.stage]] || {}).name ? " — " + h.note : ""}`,
  done: (h, n) => `${n} завершив${h.task ? " " + h.task : ""}: ${h.note || ""}`,
  needs_input: (h, n) => `${n} має питання до тебе`,
  blocked: (h, n) => `${n} заблокований${h.task ? " на " + h.task : ""}: ${h.note || ""}`,
  gate: (h, n) => `Ворота ${(h.gate || "").split("-")[0]}: ${h.note || ""}`,
  answer: (h, n) => `Ти відповів: ${h.note || ""}`,
  commit: (h, n) => `Коміт ${h.task || ""} ${h.note ? "· " + h.note : ""}`,
};

function renderFeed(p){
  const items = p.history.slice(-16).reverse();
  const mem = memory[p.slug] || {};
  const html = items.map((h, i) => {
    const R = ROLES[h.agent] || {name:h.agent, color:"#8b7cf6"};
    const txt = (EVENT_TEXT[h.event] || ((h, n) => `${n}: ${h.event} ${h.note || ""}`))(h, R.name);
    const isFresh = mem.hist !== undefined && i < p.history.length - mem.hist;
    return `<li class="${isFresh ? "fresh" : ""}"><i style="background:${R.color}"></i><span>${esc(txt)}</span><small>${ago(h.at)}</small></li>`;
  }).join("") || `<li><i></i><span class="muted">Подій ще немає</span><small></small></li>`;
  if ($("feed").dataset.html !== html){ $("feed").innerHTML = html; $("feed").dataset.html = html; }
}

function celebrate(p, lvl){
  const on = ACHIEVEMENTS.filter(a => a.test(p)).map(a => a.id);
  const mem = memory[p.slug];
  if (mem){
    on.filter(id => !mem.achs.includes(id)).forEach(id => {
      const a = ACHIEVEMENTS.find(x => x.id === id);
      toast(a.icon, "Досягнення: " + a.name, a.hint);
      confetti(70);
    });
    if (lvl > mem.lvl && p.stage !== "done"){
      toast("⬆️", `Рівень ${lvl}!`, STAGES[lvl - 1].name + " · " + STAGES[lvl - 1].desc, "lvlup");
      confetti(40);
    }
  }
  memory[p.slug] = {achs:on, lvl, hist:p.history.length};
}

// ---------- Тости й конфеті ----------
function toast(icon, title, sub, cls){
  const t = document.createElement("div");
  t.className = "toast " + (cls || "");
  t.innerHTML = `<span class="ic">${icon}</span><div><b>${esc(title)}</b><span>${esc(sub || "")}</span></div>`;
  $("toasts").appendChild(t);
  const all = $("toasts").children;
  if (all.length > 3) all[0].remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 400); }, 4200);
}

const cv = $("confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function confetti(n){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#8b7cf6","#34d399","#fbbf24","#f472b6","#60a5fa"];
  for (let i = 0; i < n; i++) parts.push({x:innerWidth * (0.3 + Math.random() * 0.4), y:innerHeight * 0.25, vx:(Math.random() - 0.5) * 9, vy:-Math.random() * 9 - 3, s:4 + Math.random() * 5, c:colors[i % colors.length], r:Math.random() * 6, life:110 + Math.random() * 40});
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.vy += 0.22; q.vx *= 0.99; q.r += 0.15; q.life--; cx.save(); cx.translate(q.x, q.y); cx.rotate(q.r); cx.fillStyle = q.c; cx.globalAlpha = Math.min(1, q.life / 40); cx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); cx.restore(); });
  parts = parts.filter(q => q.life > 0 && q.y < cv.height + 20);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}

// ---------- Живі дані ----------
let mode = "live", pollTimer = null, liveAvailable = false, lastOk = null;

async function poll(){
  let data;
  try {
    const r = await fetch("/api/state", {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    offline();
    return;
  }
  liveAvailable = true; lastOk = new Date();
  $("demoExit").hidden = false;
  if (mode !== "live") return;
  setNotice("offline", "");
  projects = data.projects || [];
  fillSelect();
  // Помилку показу не плутаємо з помилкою зв'язку: інакше сторінка мовчки завмирає
  try { render(); setNotice("render", ""); }
  catch (e) { setNotice("render", `Табло не змогло показати стан проєкту (${e.message}). Картина на екрані може бути неповною.`); }
}

// Сервер не відповів. Справжні проєкти не підміняємо демо: кажемо, з якого часу дані старі
function offline(){
  if (mode !== "live") return;
  if (!liveAvailable){ renderNoServer(); return; }
  setNotice("offline", `Немає зв'язку із сервером табло з ${pad(lastOk.getHours())}:${pad(lastOk.getMinutes())}. На екрані — стан на той момент, він міг змінитися.`);
}

function fillSelect(){
  const sel = $("proj");
  const opts = projects.map(p => `<option value="${esc(p.slug)}">${esc(p.title || p.slug)}</option>`).join("");
  if (sel.dataset.opts !== opts){ sel.innerHTML = opts; sel.dataset.opts = opts; }
  if (!selected || !projects.some(p => p.slug === selected)){
    let saved = null; try { saved = localStorage.getItem("dept.project"); } catch (e) {}
    selected = projects.some(p => p.slug === saved) ? saved : (projects[projects.length - 1] || {}).slug;
  }
  sel.value = selected || "";
  sel.style.display = projects.length ? "" : "none";
}
$("proj").addEventListener("change", e => { selected = e.target.value; try { localStorage.setItem("dept.project", selected); } catch (err) {} render(); });

// ---------- Демо ----------
const DEMO = {speed:1, playing:true, steps:[], i:0, acc:0, timer:null, S:null};

const DEMO_TASKS = [["T-001","Каркас проєкту"],["T-002","Список переговорних"],["T-003","Вхід працівника"],["T-004","Форма бронювання"],["T-005","Перевірка накладок"],
  ["T-006","Скасування бронювання"],["T-007","Календар на тиждень"],["T-008","Сповіщення на пошту"],["T-009","Адмінка кімнат"]];
const DEMO_WAVES = [["T-001"],["T-002","T-003","T-004","T-005"],["T-006","T-007","T-008","T-009"]];

function buildDemo(){
  const S = {slug:"demo", title:"Бронювання переговорних", stage:"1-start", created:nowTs(),
    gates:{"G1-brief":null,"G2-spec":null,"G3-release":null}, active:[], waiting:null, history:[], tasks:null};
  const steps = [], step = (wait, fn) => steps.push({wait, fn});
  const title = id => DEMO_TASKS.find(t => t[0] === id)[1];
  const ev = (agent, event, note, extra) => S.history.push(Object.assign({at:nowTs(), stage:S.stage, agent, event, note}, extra || {}));
  const go = id => { S.stage = id; ev("orchestrator", "stage", STAGES[STAGE_IDX[id]].name); };
  const start = (agent, doing, extra) => S.active.push(Object.assign({agent, doing, since:nowTs()}, extra || {}));
  const finish = (agent, note, event, task) => {
    const i = S.active.findIndex(a => a.agent === agent && (!task || a.task === task));
    const a = i >= 0 ? S.active.splice(i, 1)[0] : {};
    ev(agent, event || "done", note, {task:a.task, mode:a.mode});
  };
  const ask = (agent, question, gate) => { S.waiting = {gate:gate || null, agent, question, since:nowTs()}; };
  const answer = (note, gate) => {
    S.waiting = null;
    if (gate){ S.gates[gate] = {at:nowTs(), decision:note, note}; ev("human", "gate", note, {gate}); }
    else ev("human", "answer", note);
  };
  const recount = () => { const all = S.tasks.waves.flat().filter(t => t.status !== "split"); Object.assign(S.tasks, {total:all.length, done:all.filter(t => t.status === "done").length, in_progress:all.filter(t => t.status === "in_progress").length, blocked:all.filter(t => t.status === "blocked").length}); };
  const task = id => S.tasks.waves.flat().find(t => t.id === id);
  const setTask = (id, status) => { task(id).status = status; recount(); };
  const redStart = id => { const t = task(id); t.status = "in_progress"; recount(); start("test-author", "пише падаючі тести: " + title(id).toLowerCase(), {task:id}); };
  const devStart = (id, doing) => { const t = task(id); t.status = "in_progress"; t.attempts = (t.attempts || 0) + 1; recount(); start("developer", doing || "пише код під тести: " + title(id).toLowerCase(), {task:id}); };
  const commit = id => { setTask(id, "done"); ev("orchestrator", "commit", Math.random().toString(16).slice(2, 9), {task:id}); };

  step(0.5, () => ev("orchestrator", "stage", "проєкт створено"));

function startDemo(){
  mode = "demo";
  ["offline","stale","render"].forEach(key => setNotice(key, ""));
  $("demoBar").classList.add("on");
  $("demoExit").hidden = !liveAvailable;
  restartDemo();
  if (!DEMO.timer) DEMO.timer = setInterval(demoTick, 100);
}
function restartDemo(){
  const d = buildDemo();
  Object.assign(DEMO, {steps:d.steps, i:0, acc:0, S:d.S});
  delete memory.demo;
  projects = [DEMO.S]; selected = "demo";
  fillSelect(); render();
}
function demoTick(){
  if (mode !== "demo" || !DEMO.playing) return;
  DEMO.acc += 0.1 * DEMO.speed;
  let changed = false;
  while (DEMO.i < DEMO.steps.length && DEMO.acc >= DEMO.steps[DEMO.i].wait){
    DEMO.acc -= DEMO.steps[DEMO.i].wait;
    const s = DEMO.steps[DEMO.i++];
    s.fn();
    changed = true;
    if (DEMO.i === 0) break;
  }
  if (changed) render();
}
$("demoPlay").onclick = () => { DEMO.playing = !DEMO.playing; $("demoPlay").textContent = DEMO.playing ? "Пауза" : "Грати"; };
document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
  DEMO.speed = Number(b.dataset.speed);
  document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b));
});
document.querySelector('[data-speed="1"]').classList.add("on");
$("demoRestart").onclick = restartDemo;
$("demoExit").onclick = () => { mode = "live"; $("demoBar").classList.remove("on"); selected = null; poll(); };

// ---------- Старт ----------
if (new URLSearchParams(location.search).has("demo") || location.protocol === "file:") startDemo();
poll();
pollTimer = setInterval(() => { if (mode === "live") poll(); else if (!liveAvailable) poll(); }, 2000);
setInterval(() => { if (current()) renderFeed(current()); }, 30000);
